[project]
name = "unitytools"
version = "2.2.0"
description = "Local-first Unity Editor AI autopilot with semantic asset tools and Blender pipelines"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
unitytools = "unitytools.cli.entry:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unitytools*"]
