name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Hermetic suite: tests/ uses mocks + a fake bridge, so no live Unity /
      # Ollama / Anthropic is needed. The root-level test_*.py scripts are live
      # integration smoke tests and are intentionally excluded from CI.
      - name: Run tests (pytest)
        run: pytest tests/ -q
